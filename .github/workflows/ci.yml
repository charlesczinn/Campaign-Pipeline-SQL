name: build-and-check

on:
  push:
  pull_request:

jobs:
  gotv-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python synthetic/generate.py
      - name: Build the pipeline and run all data checks
        run: python gotv_coverage/run_pipeline.py --no-export
